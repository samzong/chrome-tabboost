name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify SemVer tag and package.json manifest parity
        id: meta
        run: |
          set -euo pipefail
          node scripts/check-version.js "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Install dependencies
        run: npm ci

      - name: Read release notes from CHANGELOG.md
        run: node scripts/changelog.js notes > release-notes.md

      - name: Run tests
        run: npm test

      - name: Create private key file from Secret
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem

      - name: Build and validate extension
        run: npm run validate

      - name: Package as .crx
        run: npm run package

      - name: Create ZIP file
        run: npm run zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "builds/chrome-tabboost-v$VERSION.crx" "builds/chrome-tabboost-v$VERSION.zip" "${args[@]}"

      - name: Delete private key file
        if: always()
        run: rm -f key.pem
